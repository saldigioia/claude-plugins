# Auto-generated from _template_adidas.yaml by scripts/bootstrap.py
# Platform: Adidas (SPA / API-first)
# Target: {DISPLAY_NAME}
#
# NOTE: Adidas pages are React app shells — HTML is empty. Always drain the
# /api/products/{SKU} JSON endpoints first.

name: {NAME}
display_name: "{DISPLAY_NAME}"
credit_line: "{DISPLAY_NAME}"

domains:
{DOMAINS}

project_dir: .

# CDN quality probe (tools/cdn/app.sh) — 48 host resolvers + a generic
# fallback. Used by the download stage for URLs still served by a live
# CDN, where it resolves the highest-fidelity rendition instead of
# taking whatever the page linked. Filled in by bootstrap.py; blank it
# out to fall back to a plain direct fetch.
cdn_tool: {CDN_TOOL}

cdx_dump_max_age_days: 7
cdx_dump_proxy_mode: auto

url_rules:
  - path_prefix: "/api/products/"
    url_type: api
    require_status: "200"
    require_ctype:
      - "application/json"
      - "text/html"

  - path_prefix: "/products/"
    url_type: slug
    require_status: "200"
    require_ctype: "text/html"

junk_patterns:
  - '%22|%3[CcEe]|%7[Bb]|%5[Bb]'
  - 'undefined|:productId'
  - '\.js$'

era_rules:
  - condition: "url_type == 'api'"
    era: adidas_api
  - condition: "default"
    era: adidas_web

type_priority:
  - api
  - slug

cdn_patterns:
  - name: adidas_assets
    regex: 'https?://assets\.adidas\.com/images/[^\s"''\\]+\.(?:png|jpg|jpeg|webp|gif|avif)'

shopify_cdn:
  enabled: false

alternative_archives:
  enabled: true
  sources:
    - archive_today
    - memento

download_cascade:
  # Only these three exist in download.py; site_config.py warns on anything else.
  # live_cdn is gated at runtime by has_live_cdn_url(): it fires only for URLs
  # matching this config's cdn_patterns that are not Wayback replays, so leaving
  # it on costs nothing when there is no live CDN to probe.
  - live_cdn
  - direct_fetch
  - wayback_cdx_best
